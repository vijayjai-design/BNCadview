<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="BNC FieldHouse is a college sports bar and grill in Ames, Iowa, serving game-day food, drinks, and live events for Iowa State fans."
    />
    <title>BNC FieldHouse | College Sports Bar Energy</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0d12;
        --bg-2: #101821;
        --panel: rgba(17, 24, 33, 0.92);
        --panel-soft: rgba(255, 255, 255, 0.03);
        --card: #171d25;
        --card-2: #1a2330;
        --text: #f7f5ef;
        --muted: #b7c2c9;
        --gold: #f7b733;
        --gold-2: #ffd164;
        --red: #c62828;
        --red-2: #f95555;
        --green: #4ecdc4;
        --line: rgba(255, 255, 255, 0.12);
        --shadow: 0 28px 60px rgba(0, 0, 0, 0.35);
        --radius: 22px;
      }

      * { box-sizing: border-box; }

      html { scroll-behavior: smooth; }

      body {
        margin: 0;
        font-family: "Inter", sans-serif;
        background:
          radial-gradient(circle at top, rgba(247,183,51,0.08), transparent 22%),
          linear-gradient(180deg, #090d12 0%, #0f1720 100%);
        color: var(--text);
        line-height: 1.6;
      }

      a { color: inherit; text-decoration: none; }

      img { max-width: 100%; display: block; }

      .container {
        width: min(1200px, calc(100% - 40px));
        margin: 0 auto;
      }

      .section { padding: 90px 0; }

      .eyebrow {
        display: inline-block;
        margin: 0 0 16px;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        font-size: 0.72rem;
        font-weight: 800;
        color: var(--gold-2);
      }

      .eyebrow.accent {
        color: var(--green);
      }

      h1, h2, h3 {
        margin: 0 0 16px;
        line-height: 1.04;
        font-family: "Oswald", sans-serif;
        letter-spacing: 0.02em;
      }

      h1 {
        font-size: clamp(3rem, 6vw, 5.8rem);
      }

      h2 {
        font-size: clamp(2.3rem, 4vw, 3.4rem);
      }

      h3 {
        font-size: clamp(1.4rem, 2vw, 2rem);
      }

      p {
        margin-top: 0;
        color: var(--muted);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 999px;
        padding: 15px 28px;
        font-weight: 800;
        transition: 0.25s ease;
        border: 1px solid transparent;
        cursor: pointer;
      }

      .btn:hover { transform: translateY(-2px); }

      .btn-primary {
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
        color: #190f05;
        box-shadow: 0 20px 40px rgba(247, 183, 51, 0.28);
      }

      .btn-secondary {
        background: rgba(255,255,255,0.03);
        border-color: var(--line);
        color: var(--text);
      }

      .brand-mark {
        display: inline-grid;
        place-items: center;
        width: 52px;
        height: 52px;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--gold) 0%, var(--gold-2) 100%);
        color: #120d08;
        font-weight: 900;
        font-size: 1.1rem;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: rgba(8, 13, 18, 0.72);
        backdrop-filter: blur(18px);
        border-bottom: 1px solid var(--line);
      }

      .nav-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 82px;
        gap: 20px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
      }

      .brand-text {
        display: flex;
        flex-direction: column;
      }

      .brand-name {
        font-weight: 900;
        letter-spacing: 0.04em;
      }

      .brand-name small {
        display: block;
        color: var(--muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-size: 0.56rem;
      }

      .main-nav {
        display: flex;
        align-items: center;
        gap: 24px;
        color: var(--muted);
      }

      .main-nav a { transition: color 0.2s ease; }
      .main-nav a:hover { color: var(--text); }

      .hero {
        position: relative;
        overflow: hidden;
        background:
          linear-gradient(110deg, rgba(10,13,18,0.88) 0%, rgba(10,13,18,0.6) 38%, rgba(10,13,18,0.18) 100%),
          url("https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=1400&q=80") center/cover no-repeat;
      }

      .hero-grid {
        display: grid;
        grid-template-columns: 1.08fr 0.92fr;
        align-items: center;
        gap: 36px;
        min-height: 700px;
      }

      .hero-copy {
        max-width: 680px;
      }

      .hero-copy .highlight {
        color: var(--gold-2);
      }

      .lead {
        font-size: 1.1rem;
        max-width: 56ch;
        color: #ecf1f5;
      }

      .hero-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        margin: 28px 0 32px;
      }

      .hero-stats {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        padding: 0;
        margin: 0;
      }

      .hero-stats li {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .hero-stats strong {
        font-size: clamp(1.8rem, 2.4vw, 2.6rem);
        font-weight: 900;
        color: var(--text);
      }

      .hero-stats span {
        color: var(--muted);
      }

      .hero-visual {
        position: relative;
        min-height: 560px;
        border-radius: 30px;
        overflow: hidden;
        background:
          linear-gradient(180deg, rgba(9, 12, 16, 0.05), rgba(9, 12, 16, 0.38)),
          url("https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=900&q=80") center/cover no-repeat;
        box-shadow: var(--shadow);
        border: 1px solid var(--line);
      }

      .badge-card, .score-card {
        position: absolute;
        background: rgba(12, 17, 22, 0.66);
        border: 1px solid rgba(255,255,255,0.12);
        backdrop-filter: blur(10px);
        border-radius: 22px;
        box-shadow: var(--shadow);
      }

      .badge-card {
        left: 26px;
        bottom: 22px;
        width: min(320px, 74%);
        padding: 22px 20px;
      }

      .tag {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 999px;
        background: rgba(78,205,196,0.12);
        color: var(--green);
        font-size: 0.7rem;
        letter-spacing: 0.13em;
        font-weight: 800;
        text-transform: uppercase;
      }

      .badge-card h3 {
        margin-top: 12px;
        margin-bottom: 8px;
      }

      .score-card {
        top: 30px;
        right: 28px;
        padding: 18px 20px;
        min-width: 190px;
      }

      .score-board {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-family: "Oswald", sans-serif;
        letter-spacing: 0.04em;
      }

      .score-board strong {
        font-size: 2.1rem;
      }

      .score-card small {
        color: var(--muted);
      }

      .logo-bar {
        border-top: 1px solid rgba(255,255,255,0.08);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        background: rgba(255,255,255,0.02);
      }

      .logo-row {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        text-align: center;
        padding: 18px 0;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: rgba(255,255,255,0.7);
      }

      .two-col {
        display: grid;
        grid-template-columns: 0.8fr 1.2fr;
        gap: 28px;
        align-items: center;
      }

      .cards-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 24px;
      }

      .info-card {
        background: linear-gradient(180deg, rgba(26,34,42,0.9), rgba(17,21,27,0.85));
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 26px 20px;
      }

      .icon {
        display: inline-grid;
        place-items: center;
        width: 58px;
        height: 58px;
        border-radius: 18px;
        background: rgba(247,183,51,0.12);
        font-size: 2rem;
        margin-bottom: 14px;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 24px;
      }

      .menu-card {
        overflow: hidden;
        border-radius: 22px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.02);
      }

      .menu-visual {
        height: 230px;
        background-size: cover;
        background-position: center;
      }

      .menu-visual.one {
        background-image: url("https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=900&q=80");
      }

      .menu-visual.two {
        background-image: url("https://images.unsplash.com/photo-1527477396000-e27163b481c2?auto=format&fit=crop&w=900&q=80");
      }

      .menu-visual.three {
        background-image: url("https://images.unsplash.com/photo-1550317138-10000687a72b?auto=format&fit=crop&w=900&q=80");
      }

      .menu-body {
        padding: 20px 20px 24px;
      }

      .pill {
        display: inline-flex;
        padding: 7px 11px;
        border-radius: 999px;
        background: rgba(247,183,51,0.12);
        color: var(--gold-2);
        font-size: 0.68rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 800;
      }

      .menu-body h3 { margin-top: 12px; }

      .experience-section {
        background: linear-gradient(180deg, rgba(18,24,32,0.7), rgba(11,15,20,0.96));
      }

      .experience-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 32px;
        align-items: center;
      }

      .experience-copy ul {
        margin: 18px 0 0;
        padding-left: 18px;
      }

      .experience-copy li {
        color: var(--muted);
        margin-bottom: 12px;
      }

      .stats-panel {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 20px;
      }

      .stat-box {
        border-radius: 22px;
        background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
        border: 1px solid var(--line);
        padding: 30px 18px;
        text-align: center;
      }

      .stat-box strong {
        display: block;
        font-size: clamp(1.9rem, 2.8vw, 2.8rem);
        color: var(--text);
        margin-bottom: 8px;
      }

      .stat-box span { color: var(--muted); }

      .events-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 22px;
      }

      .event-card {
        background: rgba(255,255,255,0.02);
        border: 1px solid var(--line);
        border-radius: 20px;
        padding: 18px;
        display: grid;
        grid-template-columns: 76px 1fr;
        gap: 16px;
        align-items: center;
      }

      .event-day {
        width: 76px;
        height: 76px;
        border-radius: 18px;
        background: linear-gradient(135deg, rgba(247,183,51,0.2), rgba(78,205,196,0.12));
        display: grid;
        place-items: center;
        font-weight: 900;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--gold-2);
      }

      .cta-band { padding: 0 0 30px; }

      .cta-box {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        background: linear-gradient(135deg, rgba(247,183,51,0.18), rgba(198,40,40,0.08));
        border: 1px solid rgba(255,255,255,0.1);
        border-radius: 28px;
        padding: 26px 28px;
      }

      .visit-grid {
        display: grid;
        grid-template-columns: 0.9fr 1.1fr;
        gap: 24px;
      }

      .visit-card {
        border-radius: 24px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        padding: 28px;
      }

      .contact-list { margin-top: 22px; }

      .contact-list p {
        margin-bottom: 14px;
      }

      .reservation-form {
        display: grid;
        gap: 16px;
      }

      .reservation-form label {
        display: grid;
        gap: 8px;
        color: var(--text);
        font-weight: 700;
      }

      .reservation-form input {
        width: 100%;
        min-height: 52px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(11,16,21,0.8);
        color: var(--text);
        padding: 13px 14px;
        font: inherit;
      }

      .reservation-form input::placeholder {
        color: rgba(255,255,255,0.45);
      }

      .site-footer {
        border-top: 1px solid rgba(255,255,255,0.08);
        padding: 24px 0 42px;
      }

      .footer-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .footer-links {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--muted);
      }

      @media (max-width: 980px) {
        .hero-grid,
        .two-col,
        .experience-grid,
        .visit-grid {
          grid-template-columns: 1fr;
        }

        .cards-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .menu-grid {
          grid-template-columns: 1fr;
        }

        .events-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .cta-box {
          flex-direction: column;
          align-items: flex-start;
        }
      }

      @media (max-width: 720px) {
        .main-nav { display: none; }

        .hero-grid { min-height: auto; padding-top: 30px; }

        .cards-grid,
        .events-grid,
        .stats-panel,
        .logo-row {
          grid-template-columns: 1fr;
        }

        .hero-stats {
          gap: 16px 30px;
        }

        .footer-wrap {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="container nav-wrap">
        <div class="brand">
          <div class="brand-mark">BNC</div>
          <div class="brand-text">
            <span class="brand-name">BNC FieldHouse</span>
            <small>Sports Bar & Grill</small>
          </div>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="#about">About</a>
          <a href="#menu">Menu</a>
          <a href="#experience">Experience</a>
          <a href="#events">Events</a>
          <a href="#visit">Visit</a>
        </nav>

        <a class="btn btn-primary" href="#visit">Book a Table</a>
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="container hero-grid">
          <div class="hero-copy">
            <p class="eyebrow">Ames, Iowa • Campustown energy</p>
            <h1>
              Big games.
              <span class="highlight">Big crowd.</span>
              Bigger nights.
            </h1>
            <p class="lead">
              BNC FieldHouse is where Iowa State energy meets burgers, beers, and a loud crowd that never backs down.
              Game day, trivia night, DJ sets, and late-night hangouts all happen here.
            </p>

            <div class="hero-actions">
              <a class="btn btn-primary" href="#events">See This Week</a>
              <a class="btn btn-secondary" href="#menu">Explore Menu</a>
            </div>

            <ul class="hero-stats" aria-label="BNC stats">
              <li><strong>20+</strong><span>Big Screens</span></li>
              <li><strong>Open</strong><span>Late Nights</span></li>
              <li><strong>Campus</strong><span>Favorite Spot</span></li>
            </ul>
          </div>

          <div class="hero-visual" aria-label="Sports bar interior with game day atmosphere">
            <div class="score-card">
              <small>Game Night</small>
              <div class="score-board">
                <strong>ISU</strong>
                <span>vs</span>
                <strong>RIV</strong>
              </div>
            </div>

            <div class="badge-card">
              <span class="tag">Tonight</span>
              <h3>Watch Party Energy</h3>
              <p>Doors: 5:00 PM • Kickoff: 6:30 PM • Food and drinks flowing</p>
            </div>
          </div>
        </div>
      </section>

      <section class="logo-bar">
        <div class="container logo-row">
          <div>Game Day</div>
          <div>Wings</div>
          <div>Cold Beer</div>
          <div>Live Music</div>
          <div>Trivia</div>
        </div>
      </section>

      <section id="about" class="section">
        <div class="container two-col">
          <div>
            <p class="eyebrow accent">Why BNC</p>
            <h2>The campus crowd’s go-to spot.</h2>
          </div>
          <div>
            <p>
              BNC FieldHouse is built for college nights, sports watch parties, and easy social energy.
              From late lunch to after-dark hangouts, this is where Ames comes together to eat, cheer, and stay awhile.
            </p>
          </div>
        </div>
      </section>

      <section class="section">
        <div class="container">
          <div class="cards-grid">
            <article class="info-card">
              <div class="icon">🏟️</div>
              <h3>Game Day Culture</h3>
              <p>Big screens, packed tables, and a crowd that knows how to bring the noise.</p>
            </article>

            <article class="info-card">
              <div class="icon">🍔</div>
              <h3>Bar Food Favorites</h3>
              <p>Loaded burgers, wings, nachos, and comfort food made for sharing.</p>
            </article>

            <article class="info-card">
              <div class="icon">🍻</div>
              <h3>Cold Drinks</h3>
              <p>Favorite brews and easy pours for every game, every round, every visit.</p>
            </article>

            <article class="info-card">
              <div class="icon">🎵</div>
              <h3>Live Energy</h3>
              <p>Trivia, DJ nights, karaoke, and local music keep the room moving.</p>
            </article>
          </div>
        </div>
      </section>

      <section id="menu" class="section">
        <div class="container">
          <div style="margin-bottom: 28px;">
            <p class="eyebrow accent">Favorites</p>
            <h2>Menu made for the crowd.</h2>
          </div>

          <div class="menu-grid">
            <article class="menu-card">
              <div class="menu-visual one"></div>
              <div class="menu-body">
                <span class="pill">Best Seller</span>
                <h3>Campus Classic Burger</h3>
                <p>Stacked, juicy, and built for the kind of meals shared after the game.</p>
              </div>
            </article>

            <article class="menu-card">
              <div class="menu-visual two"></div>
              <div class="menu-body">
                <span class="pill">Game Day</span>
                <h3>Wings & Shareables</h3>
                <p>Loaded nachos, quesadillas, and crispy wings made for a full table.</p>
              </div>
            </article>

            <article class="menu-card">
              <div class="menu-visual three"></div>
              <div class="menu-body">
                <span class="pill">Chef Pick</span>
                <h3>Patty Melt</h3>
                <p>Comfort classic with serious flavor, perfect for late-night energy.</p>
              </div>
            </article>
          </div>
        </div>
      </section>

      <section id="experience" class="section experience-section">
        <div class="container experience-grid">
          <div class="experience-copy">
            <p class="eyebrow accent">The Experience</p>
            <h2>From campus to closeout.</h2>
            <ul>
              <li>Sports bar atmosphere with strong local community energy</li>
              <li>Meals, drinks, and events built around big game nights</li>
              <li>Late-night hangouts for students, alumni, and locals</li>
              <li>Perfect pregame, postgame, or weekend stop in Campustown</li>
            </ul>
          </div>

          <div class="stats-panel">
            <div class="stat-box">
              <strong>206</strong>
              <span>Welch Ave</span>
            </div>
            <div class="stat-box">
              <strong>Open</strong>
              <span>Late & Loud</span>
            </div>
            <div class="stat-box">
              <strong>Weekly</strong>
              <span>Events</span>
            </div>
          </div>
        </div>
      </section>

      <section id="events" class="section">
        <div class="container">
          <div style="margin-bottom: 28px;">
            <p class="eyebrow accent">This Week</p>
            <h2>Something happening every night.</h2>
          </div>

          <div class="events-grid">
            <article class="event-card">
              <div class="event-day">Tue</div>
              <div>
                <h3>Taco Tuesday</h3>
                <p>Fast bites, easy vibe, all the energy you need.</p>
              </div>
            </article>

            <article class="event-card">
              <div class="event-day">Wed</div>
              <div>
                <h3>Wing Wednesday</h3>
                <p>$0.50 boneless wings and a packed room.</p>
              </div>
            </article>

            <article class="event-card">
              <div class="event-day">Thu</div>
              <div>
                <h3>Half-Off Appetizers</h3>
                <p>Good for the group and even better for the table.</p>
              </div>
            </article>

            <article class="event-card">
              <div class="event-day">Fri</div>
              <div>
                <h3>Live Music & DJ</h3>
                <p>Big sound, big energy, weekend mode unlocked.</p>
              </div>
            </article>
          </div>
        </div>
      </section>

      <section class="cta-band">
        <div class="container cta-box">
          <div>
            <p class="eyebrow">Plan your night</p>
            <h2>Meet the new campus hangout spot.</h2>
          </div>
          <a class="btn btn-primary" href="#visit">Reserve Your Spot</a>
        </div>
      </section>

      <section id="visit" class="section">
        <div class="container visit-grid">
          <div class="visit-card">
            <p class="eyebrow accent">Visit BNC</p>
            <h2>Show up for the next big game.</h2>
            <div class="contact-list">
              <p><strong>Address:</strong> 206 Welch Ave, Ames, IA 50014</p>
              <p><strong>Hours:</strong> Open late with extended weekend hours</p>
              <p><strong>Atmosphere:</strong> Sports bar energy, local favorite, game-night crowd</p>
            </div>
          </div>

          <div class="visit-card">
            <form class="reservation-form">
              <label>
                Name
                <input type="text" placeholder="Your name" />
              </label>

              <label>
                Email
                <input type="email" placeholder="you@example.com" />
              </label>

              <label>
                Preferred Night
                <input type="text" placeholder="Friday night / game day" />
              </label>

              <button type="submit" class="btn btn-primary full-width">Request a Table</button>
            </form>
          </div>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <div class="container footer-wrap">
        <p>© <span id="year"></span> BNC FieldHouse</p>
        <div class="footer-links">
          <a href="#about">About</a>
          <a href="#menu">Menu</a>
          <a href="#events">Events</a>
        </div>
      </div>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      const form = document.querySelector(".reservation-form");
      if (form) {
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          const button = form.querySelector("button");
          const originalText = button.textContent;
          button.textContent = "Request Sent";
          button.disabled = true;

          setTimeout(() => {
            button.textContent = originalText;
            button.disabled = false;
            form.reset();
          }, 1800);
        });
      }
    </script>
  </body>
</html>
